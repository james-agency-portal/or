<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing overview</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1D9E75;--green-light:#E1F5EE;--amber:#BA7517;--amber-light:#FAEEDA;--border:#e8e7e2;--bg:#f5f4f0;--white:#fff;--text:#1a1a1a;--muted:#888;--danger:#A32D2D;--danger-light:#FCEBEB;--blue:#378ADD;--radius:12px;--font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--font);font-size:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}

.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:1rem}
.header-left{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:18px;width:auto;flex-shrink:0}
.board-name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:8px}
.stamp{font-size:11px;color:var(--muted)}
.btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:8px;cursor:pointer;background:var(--white);border:0.5px solid var(--border);color:var(--text);transition:all .15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary:hover{background:#333}

.cat-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.cat-tab{font-size:12px;font-weight:500;padding:6px 14px;border-radius:99px;border:0.5px solid var(--border);background:var(--white);cursor:pointer;color:var(--muted);transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.cat-tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.cat-tab:hover:not(.active){background:var(--bg)}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.tab-count{font-size:11px;opacity:.65}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:1rem}
.card{background:var(--white);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.card-lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card-val{font-size:22px;font-weight:600;letter-spacing:-.01em}
.card-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.card.good{background:var(--green-light);border-color:#9FD9C4}
.card.good .card-val{color:#0F6E56}
.card.bad{background:var(--danger-light);border-color:#F09595}
.card.bad .card-val{color:var(--danger)}
.card.good .card-sub,.card.bad .card-sub{color:#444}
.prog-bar{background:var(--border);border-radius:99px;height:4px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;background:var(--green);border-radius:99px}
.prog-fill.over{background:var(--danger)}

.panel{background:var(--white);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:.75rem;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.panel-title{font-size:14px;font-weight:500;flex:1;display:flex;align-items:center;gap:9px;min-width:160px}
.panel-title.link{cursor:pointer}
.panel-title.link:hover{text-decoration:underline}
.panel-note.done{color:#0F6E56;background:var(--green-light);margin:0 16px 12px;padding:8px 12px;border-radius:8px}
.applybar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:12px 16px;border-top:0.5px solid var(--border);font-size:12.5px;color:var(--muted)}
.btn-quiet{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn-quiet:hover{background:var(--bg);color:var(--text)}
.btn:disabled{opacity:.6;cursor:default}
.panel-note.stale{color:#633806;background:var(--amber-light);margin:0 16px 12px;padding:8px 12px;border-radius:8px}
.panel-note{font-size:12px;color:var(--muted);padding:0 16px 12px;line-height:1.55}

.tbl-scroll{overflow-x:auto;border-top:0.5px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 12px;white-space:nowrap;background:#fafaf8}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th.rec,td.rec{background:#F3FAF7}
th.rec{color:#0F6E56}
td{padding:10px 12px;border-top:0.5px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.name{white-space:normal;min-width:240px;max-width:380px;line-height:1.4}
td.name a{color:var(--text);text-decoration:none;cursor:pointer}
td.name a:hover{text-decoration:underline}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#fafaf8}
tr.phantom td{color:var(--muted);font-style:italic}
tfoot td{font-weight:600;background:#fafaf8}
.sub{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.pill{font-size:11px;font-weight:500;border-radius:99px;padding:2px 9px;white-space:nowrap;display:inline-block;background:var(--bg);color:var(--muted)}
.pill.active{background:var(--green-light);color:var(--green)}
.pill.done{background:#EEE9F8;color:#6B4BB0}
.pill.warn{background:var(--amber-light);color:#633806}
.up{color:#0F6E56;font-weight:500}
.down{color:var(--danger);font-weight:500}
.flat{color:var(--muted)}
.lock{font-size:10.5px;color:var(--muted);display:block;margin-top:1px}

.planner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;font-size:13px;border-top:0.5px solid var(--border);background:#fafaf8}
.planner input{width:84px;padding:5px 8px;border:0.5px solid var(--border);border-radius:6px;background:var(--white);outline:none;text-align:right}
.planner input:focus{border-color:var(--green)}
.planner .result{margin-left:auto;color:#0F6E56;font-weight:500}

.settings{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;border-top:0.5px solid var(--border)}
.settings label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.settings input{width:100%;padding:7px 10px;border:0.5px solid var(--border);border-radius:8px;outline:none;background:var(--white)}
.settings input:focus{border-color:var(--green)}
.settings-actions{padding:0 16px 14px;display:flex;gap:8px;align-items:center}

.warning{background:var(--amber-light);border:0.5px solid #EF9F27;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:12px;color:#633806;line-height:1.5}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:13px}
.error-state{text-align:center;padding:3rem 1rem;color:var(--danger)}
.error-icon{font-size:28px;margin-bottom:.75rem}
.error-state p{font-size:13px;line-height:1.6}
.error-sub{color:var(--muted);margin-top:4px}
.loading{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:13px}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div><p>Loading board…</p></div></div>

(function () {
"use strict";

/* ---------- settings ---------- */

var DEFAULTS = {
  feePerCampaign: 500,      // management fee charged per campaign
  feeCap: 1500,             // most management we take per group, however many campaigns run
  spendBoardId: "18424974331", // board with live Meta spend, matched to this board by campaign name
  expectedCampaigns: "",    // campaigns expected per month; blank = work it out from past months and the current pace

  tolerance: 75             // after a Re-forecast, a set campaign is only changed if its management is more than this far off
};
var SETTINGS_KEY = "billing-view-settings-v1";

function loadSettings() {
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); }

function saveSettings(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {} }

/* Column titles we look for (case-insensitive). First match wins. */
var COLS = {
  paid:    ["amount paid", "total paid", "paid"],
  adspend: ["total adspend budget", "adspend budget", "total budget this billing period", "adspend"],
  status:  ["status", "campaign status"],
  start:   ["start date", "billing period start"],
  end:     ["end date", "billing period end"]

var SPEND_COLS = {
  spent: ["total adspend this billing period"],
  daily: ["meta daily spend"]
};
var FINISHED = ["finished", "closed"];

/* ---------- state ---------- */

var state = {
  settings: loadSettings(),
  boardId: null,
  board: null,        // { name, groups:[{id,title,color}], items:[...] }
  spendNote: null,
  tab: "all",
  plan: {},           // groupId -> { count, paid }
  forecasts: {},      // groupId -> saved forecast; only changes when someone clicks Re-forecast
  pendingReforecast: null,
  filling: null,           // group id while its adspend changes are being written to the board
  writeError: null,
  reforecasting: null,     // groupId while a Re-forecast is running

var root = document.getElementById("root");
var LOGO = document.getElementById("logo").innerHTML;
var demo = /[?&]demo=1/.test(location.search);
var monday = (!demo && window.mondaySdk) ? window.mondaySdk() : null;

/* ---------- helpers ---------- */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function num(v) {
  if (v == null || v === "") return null;
  var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : null;
}
function money(n) {
  if (n == null || !isFinite(n)) return "–";
  var r = Math.round(n * 100) / 100;
  var neg = r < 0; r = Math.abs(r);
  var whole = Math.abs(r - Math.round(r)) < 0.005;
  var s = r.toLocaleString("en-AU", { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
  return (neg ? "-$" : "$") + s;
}
function signed(n) {
  if (Math.abs(n) < 0.005) return '<span class="flat">no change</span>';
  return n > 0 ? '<span class="up">+' + money(n) + '</span>' : '<span class="down">' + money(n) + '</span>';
}
function norm(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function findCol(columns, titles) {
  for (var i = 0; i < titles.length; i++) {
    for (var j = 0; j < columns.length; j++) {
      if (norm(columns[j].title) === titles[i]) return columns[j].id;
    }
  }
  return null;
}
function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function shortDate(d) { return d ? d.toLocaleDateString("en-AU", { day: "numeric", month: "short" }) : ""; }
function daysLeft(it) {
  if (!it.end) return null;
  var from = today();
  if (it.start && it.start > from) from = it.start;
  return Math.round((it.end - from) / 86400000) + 1;
}
function isFinished(it) { return FINISHED.indexOf(norm(it.status)) !== -1; }

/* ---------- monday data ---------- */

function api(query, variables) {
  return monday.api(query, { variables: variables || {} }).then(function (res) {
    if (res && res.errors && res.errors.length) throw new Error(res.errors[0].message || "monday API error");
    if (res && res.error_message) throw new Error(res.error_message);
    return res.data;
  });
}

function fetchAllItems(boardId, columnIds) {
  var fields = "id name group { id } column_values(ids: $cols) { id text }";
  var first = "query ($b: [ID!], $cols: [String!]) { boards(ids: $b) { items_page(limit: 500) { cursor items { " + fields + " } } } }";
  var next = "query ($c: String!, $cols: [String!]) { next_items_page(limit: 500, cursor: $c) { cursor items { " + fields + " } } }";
  var out = [];
  function more(page) {
    out = out.concat(page.items || []);
    if (!page.cursor) return out;
    return api(next, { c: page.cursor, cols: columnIds }).then(function (d) { return more(d.next_items_page); });
  }
  return api(first, { b: [String(boardId)], cols: columnIds }).then(function (d) {
    var b = d.boards && d.boards[0];
    if (!b) throw new Error("Board " + boardId + " not found");
    return more(b.items_page);
  });
}

function fetchMeta(boardId) {
  return api("query ($b: [ID!]) { boards(ids: $b) { name groups { id title color } columns { id title type } } }", { b: [String(boardId)] })
    .then(function (d) {
      var b = d.boards && d.boards[0];
      if (!b) throw new Error("Board " + boardId + " not found");
      return b;
    });
}

function valuesById(item) {
  var o = {};
  (item.column_values || []).forEach(function (cv) { o[cv.id] = cv.text; });
  return o;
}

function fetchSpend() {
  var id = String(state.settings.spendBoardId || "").trim();
  if (!id || id === String(state.boardId)) return Promise.resolve({ map: {}, note: null });
  return fetchMeta(id).then(function (meta) {
    var spentId = findCol(meta.columns, SPEND_COLS.spent);
    var dailyId = findCol(meta.columns, SPEND_COLS.daily);
    if (!spentId) return { map: {}, note: 'Live spend is off: no "Total Adspend This Billing Period" column on ' + meta.name + "." };
    return fetchAllItems(id, [spentId, dailyId].filter(Boolean)).then(function (items) {
      var map = {};
      items.forEach(function (it) {
        var v = valuesById(it);
        map[norm(it.name)] = { spent: num(v[spentId]), daily: dailyId ? num(v[dailyId]) : null };
      });
      return { map: map, note: null };
    });
  }).catch(function (e) {
    return { map: {}, note: "Live spend is off: couldn't read board " + id + " (" + (e.message || "unknown") + ")." };
  });
}

function loadBoard() {
  if (demo) { state.board = demoBoard(); loadForecasts(); settleForecasts(); state.loading = false; state.loadedAt = new Date(); render(); return; }
  if (!state.boardId) return;
  var showSpinner = !state.board;
  if (showSpinner) { state.loading = true; render(); }
  fetchMeta(state.boardId).then(function (meta) {
    var ids = {};
    Object.keys(COLS).forEach(function (k) { ids[k] = findCol(meta.columns, COLS[k]); });
    var missing = [];
    if (!ids.paid) missing.push('"Amount Paid"');
    if (!ids.adspend) missing.push('"Total Adspend Budget"');
    var wanted = Object.keys(ids).map(function (k) { return ids[k]; }).filter(Boolean);
    return Promise.all([fetchAllItems(state.boardId, wanted), fetchSpend(), loadForecasts()]).then(function (r) {
      var spend = r[1];
      var items = r[0].map(function (raw) {
        var v = valuesById(raw);
        var live = spend.map[norm(raw.name)] || {};
        return {
          id: raw.id, name: raw.name, groupId: raw.group && raw.group.id,
          paid: ids.paid ? num(v[ids.paid]) : null,
          adspend: ids.adspend ? num(v[ids.adspend]) : null,
          status: ids.status ? v[ids.status] : "",
          start: ids.start ? parseDate(v[ids.start]) : null,
          end: ids.end ? parseDate(v[ids.end]) : null,
          spent: live.spent == null ? null : live.spent,
          daily: live.daily == null ? null : live.daily
        };
      });
      state.board = { name: meta.name, groups: meta.groups || [], items: items, missing: missing, adspendCol: ids.adspend };
      state.spendNote = spend.note;
      if (state.tab !== "all" && !state.board.groups.some(function (g) { return g.id === state.tab; })) state.tab = "all";
      settleForecasts();
      state.error = null; state.loading = false; state.loadedAt = new Date();
      render();
    });
  }).catch(function (e) {
    state.loading = false; state.reforecasting = null; state.pendingReforecast = null;
    state.error = "Could not load the board. Try refreshing. (" + (e.message || "unknown") + ")";
    render();
  });
}

/* ---------- the maths ---------- */

var HISTORY_MONTHS = 12;  // how far back the forecast looks; the newest month weighs 12, the oldest 1
var MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

/* A campaign counts once it has money against it. Blank rows are ignored. */
function counted(it) { return (it.paid || 0) > 0 || (it.adspend || 0) > 0; }

function dealFee(n) {
  var s = state.settings;
  return Math.max(0, Math.min(n * s.feePerCampaign, s.feeCap));
}

/* Groups are months, e.g. "November 2026". Returns a sortable month number, or null. */
function groupMonth(g) {
  var m = /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{4})\b/i.exec(g.title || "");
  return m ? (+m[2]) * 12 + MONTHS.indexOf(m[1].toLowerCase()) : null;
}

/* How far through the group's month we are: 0 before it starts, 1 once it's over. */
function monthProgress(g) {
  var gm = groupMonth(g), t = today();
  var y = gm != null ? Math.floor(gm / 12) : t.getFullYear(), m = gm != null ? gm % 12 : t.getMonth();
  var days = new Date(y, m + 1, 0).getDate();
  if (t < new Date(y, m, 1)) return { f: 0, day: 0, days: days };
  if (t > new Date(y, m, days)) return { f: 1, day: days, days: days };
  return { f: t.getDate() / days, day: t.getDate(), days: days };
}

/*
  What share of a month's campaigns have usually started by this point in it,
  going on the Start Date of campaigns in earlier months on this board.

  With few past campaigns to go on it leans towards assuming they arrive
  evenly through the month. The more months the board holds, the more the
  real pattern takes over.
*/
function arrivalShare(g, f) {
  if (f <= 0) return { a: 0, k: 0 };
  if (f >= 1) return { a: 1, k: 0 };
  var gm = groupMonth(g), earlier = {};
  state.board.groups.forEach(function (o) { var om = groupMonth(o); if (gm != null && om != null && om < gm) earlier[o.id] = true; });
  var k = 0, seen = 0, EVEN = 4;
  state.board.items.forEach(function (it) {
    if (!earlier[it.groupId] || !counted(it) || !it.start) return;
    var frac = it.start.getDate() / new Date(it.start.getFullYear(), it.start.getMonth() + 1, 0).getDate();
    k++; if (frac <= f + 1e-9) seen++;
  });
  return { a: (seen + EVEN * f) / (k + EVEN), k: k };
}

/* Adspend a campaign has used up for credit purposes: what it actually spent once finished, otherwise its budget. */
function usedAdspend(it) {
  return isFinished(it) && it.spent != null ? it.spent : (it.adspend || 0);
}

/* A campaign only counts towards credit once its adspend has been set. Until then its payment is just waiting to be split. */
function inCredit(it) { return !it.phantom && counted(it) && it.adspend != null; }

/* A month's credit: paid, less adspend, less the management the deal allows. + means the client has money unspent, - means over-allocated. */
function creditParts(items) {
  var paid = 0, used = 0, n = 0, waiting = 0;
  items.forEach(function (it) {
    if (it.phantom || !counted(it)) return;
    if (!inCredit(it)) { waiting++; return; }
    paid += it.paid || 0; used += usedAdspend(it); n++;
  });
  return { paid: paid, used: used, fee: dealFee(n), n: n, waiting: waiting, credit: paid - used - dealFee(n) };
}
function groupCredit(gid) {
  return creditParts(state.board.items.filter(function (it) { return it.groupId === gid; })).credit;
}
function totalCredit() {
  return state.board.groups.reduce(function (sum, g) { return sum + groupCredit(g.id); }, 0);
}
/* Credit left over (or owed) from the months before this one. It gets worked into this month's new campaigns. */
function carriedCredit(g) {
  var gm = groupMonth(g);
  if (gm == null) return 0;
  return state.board.groups.reduce(function (sum, o) {
    var om = groupMonth(o);
    return om != null && om < gm ? sum + groupCredit(o.id) : sum;
  }, 0);
}

function realCount(gid) {
  return state.board.items.filter(function (it) { return it.groupId === gid && counted(it); }).length;
}
function count1(n) { return Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1); }

/*
  Forecast how many campaigns a month will end up with, so management can be
  set right from the first campaign and not corrected after the fact.

  Two signals, blended by how far through the month we are:

    history  weighted average of campaign counts in the earlier month groups
             on this board, up to twelve months back, newer months weighing
             more (12 for the newest down to 1 for the oldest)
    pace     campaigns so far this month, scaled up to a full month using
             when in the month past campaigns have actually started

  Both come only from this board, so the forecast sharpens as months are added.
  Early in a month history does most of the work. Once most of a month's
  campaigns have usually started, the pace takes over. What's already running is certain, so the forecast is that plus
  the campaigns still expected in the days left.

  Campaigns that are only forecast count at half weight (the hedge setting)
  when the monthly fee is shared out. That way running campaigns give up some
  management for the ones we expect, but not all of it: if the expected ones
  arrive we end up holding a bit too much, which goes back into adspend as
  credit, and if they don't we're short by less.
*/
function liveForecast(g, countNow) {
  var s = state.settings, base = null, used = 0;
  var groups = state.board.groups, gm = groupMonth(g), idx = groups.indexOf(g), past = [];
  groups.forEach(function (o, i) {
    if (o.id === g.id) return;
    var om = groupMonth(o);
    if (gm != null && om != null ? om < gm : (gm == null && om == null && i > idx)) past.push({ order: om != null ? om : -i, n: realCount(o.id) });
  });
  past = past.filter(function (x) { return x.n > 0; }).sort(function (a, b) { return b.order - a.order; }).slice(0, HISTORY_MONTHS);
  var wsum = 0, nsum = 0;
  past.forEach(function (x, i) { var w = HISTORY_MONTHS - i; wsum += w; nsum += w * x.n; });
  if (wsum) { base = nsum / wsum; used = past.length; }

  var mp = monthProgress(g), f = mp.f, more, manual = num(s.expectedCampaigns);
  var share = arrivalShare(g, f), A = share.a;
  if (manual != null && manual > 0) {
    more = Math.max(0, manual - countNow);
  } else {
    // A is the share of the month's campaigns that have usually started by now.
    // Don't let one early campaign scale up to a huge month: treat it as at least a third.
    var pace = A > 0 ? countNow / Math.max(A, 1 / 3) : null;
    var rate = base != null && pace != null ? (1 - A) * base + A * pace : (base != null ? base : (pace != null ? pace : countNow));
    more = Math.max(0, rate * (1 - A));
  }
  var expected = Math.max(countNow + more, 1);
  var hedge = num(s.hedge); hedge = hedge == null ? DEFAULTS.hedge : Math.max(0, Math.min(100, hedge));
  var shareOver = Math.max(countNow + (expected - countNow) * hedge / 100, 1);
  return {
    expected: expected, more: expected - countNow, count: countNow, base: base, used: used,
    manual: manual != null && manual > 0, day: mp.day, days: mp.days, f: f, share: A, starts: share.k,
    hedge: hedge,
    feeEach: Math.round(dealFee(shareOver) / shareOver * 100) / 100,
    ifAllArrive: Math.round(dealFee(shareOver) / shareOver * expected * 100) / 100, owedIfAllArrive: dealFee(expected),
    at: Date.now()

}

function describeForecast(fc) {
  var t = fc.count + " running";
  if (fc.f >= 1) t += ", month finished";
  else if (fc.f <= 0) t += ", month not started";
  else t += ", day " + fc.day + " of " + fc.days;
  if (fc.manual) t += ". Expected total set in Settings";
  else if (fc.base != null) t += ". Past " + (fc.used === 1 ? "month" : fc.used + " months") + " average " + count1(fc.base);
  if (!fc.manual && fc.starts >= 4 && fc.f > 0 && fc.f < 1) t += ". By now about " + Math.round(fc.share * 100) + "% of a month's campaigns have usually started";
  if (fc.more >= 0.05) {
    t += ". Expecting about " + count1(fc.more) + " more, " + count1(fc.expected) + " in total";
    t += fc.hedge < 100 ? ". Counting the expected ones at " + (fc.hedge === 50 ? "half" : fc.hedge + "%") + ", that's " : ", so ";
    t += money(fc.feeEach) + " management each.";
  } else {
    t += ". Expecting no more, so " + money(fc.feeEach) + " management each.";
  }
  return t;
}

/*
  The note for a saved forecast. The forecast itself holds still, but the count
  and the day are today's, so it never reads as out of date.
*/
function describeSaved(fc, now) {
  if (!now || (now.count === fc.count && now.day === fc.day)) return describeForecast(fc);
  var t = now.count + " running";
  if (now.f >= 1) t += ", month finished";
  else if (now.f <= 0) t += ", month not started";
  else t += ", day " + now.day + " of " + now.days;
  var made = fc.at ? new Date(fc.at).toLocaleDateString("en-AU", { day: "numeric", month: "short" }) : "earlier";
  var left = fc.expected - now.count;
  t += ". The forecast from " + made + " (" + fc.count + " running then) expects " + count1(fc.expected) + " for the month";
  if (left >= 0.5) t += ", so about " + count1(left) + " more";
  else if (left > -0.5) t += ", which is where it is now";
  else t += ", and " + count1(-left) + " more than that " + (Math.abs(left) < 1.5 ? "has" : "have") + " come in";
  t += ". Management is " + money(fc.feeEach) + " each.";
  return t;
}

/*
  Recommended adspend and management for a group's campaigns.

  The aim is to get it right when a campaign is set up and then leave it alone.

  New campaigns (Amount Paid filled in, no adspend yet) get the forecast
  management figure, and the rest of what they paid is adspend. If the
  campaigns already set are holding more or less management than the forecast
  calls for, the new ones take the difference, so the old ones don't move.

  Campaigns already set are left alone. The one exception is after someone
  clicks Re-forecast: then any set campaign whose management is over or under
  the new forecast figure by more than the tolerance (default $75) is brought
  onto it, and if the group is still short by more than that, the ones holding
  the least are raised first. That round closes once the changes are applied.

  Money already gone can't be moved: finished campaigns are held at what they
  spent (or their budget if we have no spend figure), and a running campaign
  is never recommended less than it has already spent.
*/
function allocate(items, g) {
  var rows = items.filter(counted);
  var n = rows.length;
  var paid = 0, adspend = 0, used = 0, spent = 0, hasSpend = false, whatIf = false;
  rows.forEach(function (it) {
    paid += it.paid || 0; adspend += it.adspend || 0; used += it.phantom ? 0 : usedAdspend(it);
    if (it.spent != null) { spent += it.spent; hasSpend = true; }
    if (it.phantom) whatIf = true;
  });
  var fee = dealFee(n), cp = creditParts(rows);
  var now = g ? liveForecast(g, n) : null;
  var fc = g ? (whatIf ? now : (state.forecasts[g.id] || now)) : null;
  var feeEach = fc ? fc.feeEach : (n ? fee / n : 0);

  // Management the campaigns here should hold between them. Never more than the deal allows for this many.
  var required = Math.min(feeEach * n, fee);

  var rec = {}, why = {}, held = 0, fresh = [], movable = [], moved = 0;
  // Set campaigns are only ever changed as part of a Re-forecast someone clicked, until those changes are applied.
  var reviewing = !!(fc && fc.review && !whatIf);
  var tol = num(state.settings.tolerance); tol = tol == null || tol < 0 ? DEFAULTS.tolerance : tol;
  rows.forEach(function (it) {
    if (!it.phantom && isFinished(it)) {
      rec[it.id] = it.spent != null ? it.spent : (it.adspend || 0);
      why[it.id] = it.spent != null ? "finished, held at spend" : "finished, held at budget";
      held += (it.paid || 0) - rec[it.id];
    } else if (it.phantom || it.adspend == null) {
      fresh.push(it);
    } else {
      // Normally left alone. After a Re-forecast, one that is over or under by more than the tolerance is brought onto the forecast figure.
      var mNow = (it.paid || 0) - it.adspend, r = it.adspend;
      if (reviewing && Math.abs(mNow - feeEach) > tol) {
        r = Math.max((it.paid || 0) - Math.min(feeEach, it.paid || 0), Math.max(0, it.spent || 0));
        if (Math.abs(r - it.adspend) >= 1) { moved++; if (r > (it.paid || 0) - feeEach + 0.005) why[it.id] = "already spent more"; }
        else r = it.adspend;
      }
      rec[it.id] = r;
      held += (it.paid || 0) - r;
      movable.push(it);
    }
  });

  // Credit carried in from earlier months. Positive goes back to the client as extra adspend,
  // negative is recovered by holding adspend back.
  var carry = g ? carriedCredit(g) : 0, carryShare = {}, placed = 0;
  if (Math.abs(carry) < 1) carry = 0;
  // How much of it is still to be placed: campaigns already set this month may have used it up.
  var setRequired = Math.min(feeEach * (n - fresh.length), dealFee(n - fresh.length));
  var left = carry + held - setRequired;
  var creditLeft = carry > 0 ? Math.max(0, Math.min(left, carry)) : carry < 0 ? Math.min(0, Math.max(left, carry)) : 0;
  if (Math.abs(creditLeft) < 1) creditLeft = 0;
  var label = function (it, amount) {
    if (Math.abs(amount) < 1) return;
    carryShare[it.id] = amount; placed += amount;
    if (!why[it.id]) why[it.id] = amount > 0 ? "includes " + money(amount) + " credit" : "less " + money(-amount) + " owed from earlier";
  };

  // New campaigns share whatever management is still needed, and take the carried credit between them.
  // Leaving credit aside, a new campaign's management stays between nothing and the full per-campaign fee.
  var freshFee = null;
  if (fresh.length) {
    var perNew = creditLeft / fresh.length;
    var share = (required - held - carry) / fresh.length;
    share = Math.max(share, -Math.max(0, perNew));
    share = Math.min(share, state.settings.feePerCampaign + Math.max(0, -perNew));
    fresh.forEach(function (it) {
      var m = Math.min(share, it.paid || 0), floor = Math.max(0, it.spent || 0);
      rec[it.id] = Math.max((it.paid || 0) - m, floor);
      if (floor > (it.paid || 0) - m + 0.005) why[it.id] = "already spent more";
      held += (it.paid || 0) - rec[it.id];
      label(it, perNew);
      if (freshFee == null) freshFee = (it.paid || 0) - rec[it.id] + perNew;
    });
  } else if (reviewing && movable.length && Math.abs(left) > tol) {
    // No new campaigns to carry it, and a Re-forecast is open: spread what's left over (or owed) across the set campaigns.
    movable.forEach(function (it) {
      var r2 = Math.max(rec[it.id] + left / movable.length, Math.max(0, it.spent || 0));
      held -= r2 - rec[it.id]; rec[it.id] = r2;
      label(it, creditLeft / movable.length);
    });
  }

  // Still short? Raise the campaigns holding the least management up to a common level, as far as their unspent budget allows.
  // Credit from earlier months counts towards this month's management: it was paid for back then.
  var short = required - held - carry, raised = 0;
  if (reviewing && short > tol && movable.length) {
    var m0 = {}, cap = {}, lo = Infinity, hi = 0;
    movable.forEach(function (it) {
      m0[it.id] = (it.paid || 0) - rec[it.id];
      cap[it.id] = Math.max(m0[it.id], (it.paid || 0) - Math.max(0, it.spent || 0));
      lo = Math.min(lo, m0[it.id]); hi = Math.max(hi, cap[it.id]);
    });
    var gain = function (level) {
      var g2 = 0;
      movable.forEach(function (it) { g2 += Math.max(0, Math.min(level, cap[it.id]) - m0[it.id]); });
      return g2;
    };
    var a0 = lo, b0 = hi;
    if (gain(hi) > short) { for (var k = 0; k < 60; k++) { var mid = (a0 + b0) / 2; if (gain(mid) >= short) b0 = mid; else a0 = mid; } }
    movable.forEach(function (it) {
      var m = Math.max(m0[it.id], Math.min(b0, cap[it.id]));
      if (m - m0[it.id] >= 0.005) { rec[it.id] = (it.paid || 0) - m; why[it.id] = "trimmed to cover management"; raised++; held += m - m0[it.id]; }
    });
    short = required - held - carry;
  }

  var recSum = 0, changes = 0;
  rows.forEach(function (it) {
    recSum += rec[it.id];
    if (!it.phantom && !isFinished(it) && (it.adspend == null || Math.abs(rec[it.id] - it.adspend) >= 1)) changes++;
  });

  return {
    rows: rows, n: n, paid: paid, adspend: adspend, spent: spent, hasSpend: hasSpend,
    fee: fee,                          // what the deal says is owed for the campaigns here now
    boardFee: paid - adspend,          // what the board's formula column adds up to
    credit: cp.credit,                 // + = money not yet put into adspend, - = over-allocated
    cp: cp,
    used: used, carry: carry, creditLeft: creditLeft, placed: placed, carryShare: carryShare,
    blendedFee: n ? fee / n : 0,
    feeRate: paid ? fee / paid : 0,
    rec: rec, why: why, recSum: recSum,
    required: required, short: Math.max(0, short), raised: raised, moved: moved, tol: tol, reviewing: reviewing, fresh: fresh.length, freshFee: freshFee, set: movable.length,
    changes: changes, needsChange: changes > 0,
    collected: paid - recSum + carry,          // management we'd keep if the recommendations were applied and nothing else changed
    forecast: fc, whatIf: whatIf,
    // Re-forecasting is for emergencies. Only flag it when the month has gone well off the original forecast:
    // out by a campaign and a half or more, and enough to move management per campaign by $50.
    stale: !!(fc && now && !whatIf && Math.abs(now.expected - fc.expected) >= 1.5 && Math.abs(now.feeEach - fc.feeEach) >= 50), now: now
  };
}

/* ---------- saved forecasts ---------- */

function fcKey() { return "billing-forecasts-" + (state.boardId || "demo"); }

/* Shared through monday's storage where we can, so everyone sees the same forecast. Browser storage is the fallback. */
function loadForecasts() {
  var local = {};
  try { local = JSON.parse(localStorage.getItem(fcKey()) || "{}") || {}; } catch (e) {}
  state.forecasts = local;
  if (!monday || !monday.storage || !monday.storage.instance) return Promise.resolve();
  var shared = monday.storage.instance.getItem(fcKey()).then(function (res) {
    var v = res && res.data && res.data.value;
    var remote = v ? JSON.parse(v) : {};
    Object.keys(remote || {}).forEach(function (gid) {
      if (!state.forecasts[gid] || (remote[gid].at || 0) >= (state.forecasts[gid].at || 0)) state.forecasts[gid] = remote[gid];
    });
  }).catch(function () {});
  return Promise.race([shared, new Promise(function (r) { setTimeout(r, 1500); })]);
}
function saveForecasts() {
  var v = JSON.stringify(state.forecasts);
  try { localStorage.setItem(fcKey(), v); } catch (e) {}
  try { if (monday && monday.storage && monday.storage.instance) monday.storage.instance.setItem(fcKey(), v).catch(function () {}); } catch (e) {}
}

/* Runs after every load: gives new groups a first forecast, and redoes the ones the button asked for. */
function settleForecasts() {
  var redo = state.pendingReforecast, changed = false;
  state.pendingReforecast = null; state.reforecasting = null;
  state.board.groups.forEach(function (g) {
    var want = redo && (redo === "all" || redo === g.id);
    if (!want && state.forecasts[g.id]) return;
    var before = state.forecasts[g.id] || null;
    state.forecasts[g.id] = liveForecast(g, realCount(g.id));
    state.forecasts[g.id].review = !!want;   // a clicked Re-forecast opens set campaigns up for one round of changes
    if (want) state.reforecastResult = { gid: g.id, before: before, after: state.forecasts[g.id] };
    changed = true;
  });
  if (changed) saveForecasts();
}

function groupItems(gid) {
  var items = state.board.items.filter(function (it) { return it.groupId === gid; });
  var p = state.plan[gid];
  if (p && p.count > 0) {
    for (var i = 0; i < Math.min(p.count, 20); i++) {
      items.push({ id: "phantom-" + i, name: "New campaign " + (i + 1), groupId: gid, paid: p.paid || 0, adspend: 0, status: "Planned", spent: null, daily: null, start: null, end: null, phantom: true });
    }
  }
  return items;
}

/* ---------- rendering ---------- */

function statusPill(it) {
  if (!it.status) return "";
  var s = norm(it.status), cls = "";
  if (s === "active") cls = " active";
  else if (FINISHED.indexOf(s) !== -1) cls = " done";
  else if (s === "paused") cls = " warn";
  return '<span class="pill' + cls + '">' + esc(it.status) + "</span>";
}

function creditCard(a, label) {
  var c = a.credit;
  if (!a.n) return card(label, "–", "No campaigns with money against them yet.");
  var cp = a.cp, wait = cp.waiting ? " " + cp.waiting + (cp.waiting === 1 ? " campaign isn't" : " campaigns aren't") + " counted until adspend is set." : "";
  if (!cp.n) return card(label, "–", "No campaign has its adspend set yet.");
  var sub = "Paid " + money(cp.paid) + " less " + money(cp.used) + " adspend and " + money(cp.fee) + " management." + wait;
  if (Math.abs(c) < 0.005) return card(label, "Balanced", "Adspend plus management equals what was paid." + wait);
  if (c > 0) return card(label, money(c), "Under. " + sub + " This much is still unallocated.", "good");
  return card(label, "-" + money(-c), "Over-allocated. " + sub, "bad");
}

/* Every month on the board added together. Shown beside the month's own credit. */
function totalCreditCard() {
  var c = totalCredit(), months = state.board.groups.length;
  var sub = "Across " + (months === 1 ? "the one month" : "all " + months + " months") + " on the board.";
  if (Math.abs(c) < 0.005) return card("Total credit", "Balanced", sub);
  if (c > 0) return card("Total credit", money(c), sub + " The client has this much unspent.", "good");
  return card("Total credit", "-" + money(-c), sub + " Over-allocated by this much.", "bad");
}

function card(label, value, sub, cls, extra) {
  return '<div class="card ' + (cls || "") + '"><div class="card-lbl">' + esc(label) + '</div><div class="card-val">' + esc(value) + "</div>" +
    (sub ? '<div class="card-sub">' + esc(sub) + "</div>" : "") + (extra || "") + "</div>";
}

function cards(a, groupCount) {
  var s = state.settings;
  var feeSub = a.n + (a.n === 1 ? " campaign" : " campaigns") + " at " + money(s.feePerCampaign) + ", capped at " + money(s.feeCap) + (groupCount > 1 ? " per group" : "") + ".";
  if (Math.abs(a.boardFee - a.fee) >= 0.005) feeSub += " Board currently shows " + money(a.boardFee) + ".";
  var html = '<div class="cards">';
  html += card("Total paid", money(a.paid), a.n + (a.n === 1 ? " campaign" : " campaigns"));
  html += card("Adspend budgeted", money(a.adspend), a.paid ? Math.round(a.adspend / a.paid * 100) + "% of what was paid" : "");
  html += card("Management", money(a.fee), feeSub);
  if (a.isBoard) html += creditCard(a, "Total credit");
  else html += creditCard(a, "Credit this month") + totalCreditCard();
  if (a.hasSpend) {
    var pct = a.adspend ? a.spent / a.adspend * 100 : 0;
    html += card("Spent so far", money(a.spent), money(a.adspend - a.spent) + " of budget left", "",
      '<div class="prog-bar"><div class="prog-fill' + (pct > 100 ? " over" : "") + '" style="width:' + Math.min(100, pct).toFixed(1) + '%"></div></div>');
  }
  if (a.forecast) {
    html += card("Forecast management", money(a.forecast.feeEach), "per campaign, expecting " + count1(a.forecast.expected) + " this month");
  } else {
    html += card("Management per campaign", a.n ? money(a.blendedFee) : "–", a.n ? "average across the board" : "");
  }
  html += "</div>";
  return html;
}

function campaignTable(a, opts) {
  opts = opts || {};
  var h = '<div class="tbl-scroll"><table><thead><tr><th>Campaign</th><th>Paid</th><th>Adspend now</th><th>Mgmt now</th>';
  if (a.hasSpend) h += "<th>Spent</th>";
  h += '<th class="rec">Recommended adspend</th><th class="rec">Recommended mgmt</th><th class="rec">Change</th><th class="rec">Daily to hit it</th></tr></thead><tbody>';
  a.rows.forEach(function (it) {
    var rec = a.rec[it.id];
    var d = daysLeft(it), daily = "–";
    if (!it.phantom && !isFinished(it)) {
      if (!it.end) {
        daily = '–<span class="sub">needs an end date</span>';
      } else if (it.spent != null && d > 0) {
        // Already running with a spend figure: spread what's left over the days left.
        daily = money(Math.max(0, rec - it.spent) / d) + '<span class="sub">' + d + (d === 1 ? " day" : " days") + " left" + (it.daily != null ? ", now " + money(it.daily) : "") + "</span>";
      } else if (it.spent == null) {
        // No spend yet, so this is the figure to set the campaign up with: the whole budget over the whole run.
        var run = it.start ? Math.round((it.end - it.start) / 86400000) + 1 : d;
        if (run > 0) daily = money(rec / run) + '<span class="sub">over ' + run + (run === 1 ? " day" : " days") + (it.start ? "" : " from today") + "</span>";
      }
    }
    var dates = (it.start || it.end) ? '<span class="sub">' + esc(shortDate(it.start)) + (it.end ? " to " + esc(shortDate(it.end)) : "") + "</span>" : "";
    h += '<tr class="' + (it.phantom ? "phantom" : "") + '">';
    h += '<td class="name">' + (it.phantom ? esc(it.name) : '<a data-item="' + esc(it.id) + '">' + esc(it.name) + "</a>") + " " + statusPill(it) + dates + "</td>";
    h += "<td>" + money(it.paid || 0) + "</td>";
    // Only Amount Paid filled in: nothing to compare against yet, so just say what to set.
    var unset = !it.phantom && it.adspend == null;
    h += "<td>" + (it.phantom ? "–" : unset ? '<span class="flat">not set</span>' : money(it.adspend)) + "</td>";
    h += "<td>" + (it.phantom || unset ? "–" : money((it.paid || 0) - it.adspend)) + "</td>";
    if (a.hasSpend) h += "<td>" + (it.spent == null ? "–" : money(it.spent)) + "</td>";
    h += '<td class="rec"><strong>' + money(rec) + "</strong>" + (a.why[it.id] ? '<span class="lock">' + esc(a.why[it.id]) + "</span>" : "") + "</td>";
    h += '<td class="rec">' + money((it.paid || 0) - rec + (a.carryShare[it.id] || 0)) + "</td>";
    h += '<td class="rec">' + (it.phantom ? '<span class="flat">new</span>' : unset ? '<span class="up">set adspend to ' + money(rec) + "</span>" : changeCell(a, rec - (it.adspend || 0))) + "</td>";
    h += '<td class="rec">' + daily + "</td>";
    h += "</tr>";
  });
  h += "</tbody><tfoot><tr><td>Total</td><td>" + money(a.paid) + "</td><td>" + money(a.adspend) + "</td><td>" + money(a.boardFee) + "</td>";
  if (a.hasSpend) h += "<td>" + money(a.spent) + "</td>";
  h += '<td class="rec">' + money(a.recSum) + '</td><td class="rec">' + money(a.paid - a.recSum + a.placed) + '</td><td class="rec">' + signed(a.recSum - a.adspend) + '</td><td class="rec"></td></tr></tfoot></table></div>';
  return h;
}

/* Rows where the board's adspend budget differs from the recommendation. Finished campaigns and what-if rows are never written. */
function pendingChanges(a) {
  if (a.whatIf) return [];
  return a.rows.filter(function (it) {
    return !it.phantom && !isFinished(it) && (it.adspend == null || Math.abs(a.rec[it.id] - it.adspend) >= 1);
  }).map(function (it) { return { id: it.id, value: Math.round(a.rec[it.id] * 100) / 100, from: it.adspend, item: it }; });
}

/* The one button: writes every recommended adspend for the group into the board in one go. */
function applyBar(gid, a) {
  var list = pendingChanges(a);
  if (!list.length) return "";
  var fills = list.filter(function (c) { return c.from == null; }).length, edits = list.length - fills;
  var what = [];
  if (fills) what.push("fill in " + fills + " new");
  if (edits) what.push("change " + edits + " already set");
  var busy = state.filling === gid;
  return '<div class="applybar"><span>This will ' + esc(what.join(" and ")) + '.</span><button class="btn btn-primary" data-apply="' + esc(gid) + '"' + (state.filling ? " disabled" : "") + ">" +
    (busy ? "Saving…" : "Apply " + (list.length === 1 ? "change" : "all " + list.length + " changes")) + "</button></div>";
}

/* The round of changes a Re-forecast opened is done once it has been applied. */
function closeReview(gid) {
  if (state.forecasts[gid] && state.forecasts[gid].review) { state.forecasts[gid].review = false; saveForecasts(); }
}

function applyAll(gid) {
  var g = state.board.groups.filter(function (x) { return x.id === gid; })[0];
  if (!g || state.filling) return;
  var list = pendingChanges(allocate(state.board.items.filter(function (it) { return it.groupId === gid; }), g));
  if (!list.length) return;
  if (demo) { list.forEach(function (c) { c.item.adspend = c.value; }); closeReview(gid); render(); return; }
  var col = state.board.adspendCol;
  if (!col) return;
  var edits = list.filter(function (c) { return c.from != null; }).length;
  var ask = !edits ? Promise.resolve(true)
    : monday.execute("confirm", { message: "This changes the adspend budget on " + edits + (edits === 1 ? " campaign" : " campaigns") + " that already " + (edits === 1 ? "has" : "have") + " one" + (list.length > edits ? ", and fills in " + (list.length - edits) + " new" : "") + ". Go ahead?", confirmButton: "Apply", cancelButton: "Cancel" })
        .then(function (res) { return !!(res && res.data && res.data.confirm); });
  var done = 0;
  ask.then(function (ok) {
    if (!ok) return;
    state.filling = gid; state.writeError = null; render();
    var chain = Promise.resolve();
    list.forEach(function (c) {
      chain = chain.then(function () {
        return api("mutation ($b: ID!, $i: ID!, $c: String!, $v: String!) { change_simple_column_value(board_id: $b, item_id: $i, column_id: $c, value: $v) { id } }",
          { b: String(state.boardId), i: String(c.id), c: col, v: String(c.value) }).then(function () { done++; });
      });
    });
    return chain.then(function () {
      state.filling = null; closeReview(gid);
      try { monday.execute("notice", { message: "Adspend budget updated on " + done + (done === 1 ? " campaign" : " campaigns"), type: "success", timeout: 4000 }); } catch (e) {}
      loadBoard();
    });
  }).catch(function (e) {
    state.filling = null;
    var msg = (e && e.message) || "unknown error";
    var sofar = done ? done + " of " + list.length + " were saved before it stopped. " : "Nothing was changed. ";
    state.writeError = /scope|permission|unauthori[sz]ed|not allowed/i.test(msg)
      ? "monday blocked the change because the app is only allowed to read boards. " + sofar + "Add the boards:write permission to the app in Developers, then try again. (" + msg + ")"
      : "Couldn't write to the board. " + sofar + "(" + msg + ")";
    if (done) loadBoard(); else render();
  });
}

function changeCell(a, diff) {
  return Math.abs(diff) < 1 ? '<span class="flat">no change</span>' : signed(diff);
}

/* Says what the last Re-forecast click did, so it's obvious it ran even when the numbers didn't move. */
function reforecastMsg(gid) {
  var r = state.reforecastResult;
  if (!r || r.gid !== gid) return "";
  var b = r.before, a = r.after, t;
  var time = new Date(a.at).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit", second: "2-digit" });
  if (b && Math.abs(b.feeEach - a.feeEach) < 0.005 && Math.abs(b.expected - a.expected) < 0.05) {
    t = "Re-forecast at " + time + ". Nothing has moved since the last one, so it's still " + count1(a.expected) + " campaigns expected and " + money(a.feeEach) + " management each.";
  } else {
    t = "Re-forecast at " + time + ". " + (b ? "Was " + count1(b.expected) + " campaigns expected and " + money(b.feeEach) + " each. " : "") + "Now " + count1(a.expected) + " expected and " + money(a.feeEach) + " management each.";
  }
  return '<div class="panel-note done">' + esc(t) + "</div>";
}

function recNote(a) {
  if (!a.n) return "";
  var fc = a.forecast, t = a.whatIf ? "What if: " + describeForecast(fc) : describeSaved(fc, a.now);
  if (a.placed) {
    var who = a.fresh ? (a.fresh === 1 ? "the new campaign" : "the " + a.fresh + " new campaigns") : "the campaigns here";
    t += a.placed > 0 ? " Earlier months left " + money(a.placed) + " credit, so that is added to the adspend of " + who + "."
                      : " Earlier months are over by " + money(-a.placed) + ", so that is held back from the adspend of " + who + ".";
  } else if (a.creditLeft) {
    t += a.creditLeft > 0 ? " Earlier months left " + money(a.creditLeft) + " credit. It will go into the next new campaign's adspend." : " Earlier months are over by " + money(-a.creditLeft) + ". It will come off the next new campaign's adspend.";
  } else if (a.carry) {
    t += a.carry > 0 ? " The " + money(a.carry) + " credit from earlier months has already gone into this month's adspend." : " The " + money(-a.carry) + " owed from earlier months has already been held back this month.";
  } else if (a.fresh && a.freshFee != null && Math.abs(a.freshFee - fc.feeEach) >= 1) {
    t += " The campaigns already set hold " + (a.freshFee < fc.feeEach ? "more" : "less") + " than that between them, so " + (a.whatIf ? "new ones would go in" : "the new " + (a.fresh === 1 ? "one goes" : "ones go") + " in") + " at " + money(a.freshFee) + " to even it out.";
  }
  if (!a.whatIf) {
    if (a.raised) t += " Management was going to come up short, so " + a.raised + (a.raised === 1 ? " campaign" : " campaigns") + " already set " + (a.raised === 1 ? "needs" : "need") + " to give some adspend back, starting with the ones holding the least management.";
    else if (a.moved) t += " After this Re-forecast, " + a.moved + (a.moved === 1 ? " campaign already set is" : " campaigns already set are") + " more than " + money(a.tol) + " over or under that, so " + (a.moved === 1 ? "it's" : "they're") + " brought onto it." + (a.set > a.moved ? " The rest are close enough to leave." : "");
    else if (a.set && a.reviewing && !a.placed) t += " Everything already set is within " + money(a.tol) + " of that, so nothing needs to change.";
    else if (a.set) t += " Campaigns already set stay as they are.";
    if (a.short > 1) t += " Even so it's " + money(a.short) + " short, because the rest has already been spent.";
    if (a.collected > a.fee + 1) t += " Management held is " + money(a.collected - a.fee) + " over what's owed today, which sits as credit.";
    else if (a.collected < a.fee - 20 && fc.more >= 0.05) t += " Holding " + money(a.collected) + " against " + money(a.fee) + " owed for now. The campaigns still expected make up the rest.";
  }
  var h = '<div class="panel-note">' + esc(t) + "</div>";
  if (a.stale) {
    h += '<div class="panel-note stale">This month is well off the forecast. It expected about ' + esc(count1(fc.expected)) + " campaigns and it now looks like " + esc(count1(a.now.expected)) +
      (a.now.expected < fc.expected ? ", so management is on track to come up short" : ", so more management is being held than needed") +
      ". Re-forecast to reset it to " + esc(money(a.now.feeEach)) + " each.</div>";
  }
  return h;
}

function planner(gid, a) {
  var p = state.plan[gid] || { count: 0, paid: "" };
  var s = state.settings, res = "";
  if (p.count > 0) {
    res = '<span class="result">' + a.n + " running, " + count1(a.forecast.expected) + " expected: new ones at " + money(a.freshFee != null ? a.freshFee : a.forecast.feeEach) + " management</span>";
  }
  return '<div class="planner"><span>What if we add</span><input type="number" min="0" max="20" step="1" data-plan="count" value="' + esc(p.count || "") + '" placeholder="0">' +
    '<span>more campaigns paying</span><input type="number" min="0" step="50" data-plan="paid" value="' + esc(p.paid) + '" placeholder="$ each"><span>each?</span>' +
    (p.count > 0 ? '<button class="btn" data-plan-clear>Clear</button>' : "") + res + "</div>";
}

function groupPanel(g, opts) {
  var a = allocate(groupItems(g.id), g);
  var h = '<div class="panel"><div class="panel-head">';
  h += '<div class="panel-title' + (opts.link ? " link" : "") + '"' + (opts.link ? ' data-tab="' + esc(g.id) + '"' : "") + '><span class="sdot" style="background:' + esc(g.color || "#888") + '"></span>' + esc(g.title) + "</div>";
  var saved = state.forecasts[g.id];
  if (saved && saved.at) h += '<span class="stamp">Forecast from ' + esc(new Date(saved.at).toLocaleString("en-AU", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })) + "</span>";
  var busy = state.reforecasting === g.id;
  // Quiet by default. It only stands out when the month has gone far enough off to need it.
  h += '<button class="btn' + (a.stale ? " btn-primary" : " btn-quiet") + '" data-reforecast="' + esc(g.id) + '"' + (busy ? " disabled" : "") + ">" + (busy ? "Re-forecasting…" : "Re-forecast") + "</button>";
  h += "</div>";
  if (!a.n) {
    // Nothing in yet: still say what the first campaign should be set up at.
    if (a.forecast) h += '<div class="panel-note">' + esc(describeForecast(a.forecast)) + " Add a campaign with its Amount Paid and this will show what to set.</div>";
    h += '<div class="empty">No campaigns with an amount paid in this group yet.</div></div>'; return h;
  }
  h += reforecastMsg(g.id) + recNote(a) + campaignTable(a);
  h += applyBar(g.id, a);
  if (opts.planner) h += planner(g.id, a);
  h += "</div>";
  return h;
}

function summaryTable(groups) {
  var h = '<div class="panel"><div class="panel-head"><div class="panel-title">Groups</div></div><div class="tbl-scroll"><table><thead><tr><th>Group</th><th>Campaigns</th><th>Paid</th><th>Adspend</th><th>Management</th><th>Credit</th><th class="rec">Forecast mgmt each</th></tr></thead><tbody>';
  groups.forEach(function (g) {
    var a = allocate(groupItems(g.id), g);
    var credit = Math.abs(a.credit) < 0.005 ? '<span class="flat">balanced</span>' : (a.credit > 0 ? '<span class="up">' + money(a.credit) + " under</span>" : '<span class="down">' + money(-a.credit) + " over</span>");
    h += '<tr class="clickable" data-tab="' + esc(g.id) + '"><td class="name"><span class="sdot" style="background:' + esc(g.color || "#888") + '"></span> ' + esc(g.title) + "</td><td>" + a.n + "</td><td>" + money(a.paid) + "</td><td>" + money(a.adspend) + "</td><td>" + money(a.fee) + "</td><td>" + credit + '</td><td class="rec">' + (a.forecast ? money(a.forecast.feeEach) + '<span class="sub">' + count1(a.forecast.expected) + " expected</span>" : "–") + "</td></tr>";
  });
  h += "</tbody></table></div></div>";
  return h;
}

/* Whole-board totals: the cap applies to each group separately, so add the groups up. */
function boardTotals(groups) {
  var t = { n: 0, paid: 0, adspend: 0, used: 0, spent: 0, hasSpend: false, fee: 0, isBoard: true, cp: { paid: 0, used: 0, fee: 0, n: 0, waiting: 0 } };
  groups.forEach(function (g) {
    var a = allocate(state.board.items.filter(function (it) { return it.groupId === g.id; }), g);
    t.n += a.n; t.paid += a.paid; t.adspend += a.adspend; t.used += a.used; t.fee += a.fee;
    ["paid", "used", "fee", "n", "waiting"].forEach(function (k) { t.cp[k] += a.cp[k]; });
    if (a.hasSpend) { t.spent += a.spent; t.hasSpend = true; }
  });
  t.boardFee = t.paid - t.adspend;
  t.credit = t.cp.paid - t.cp.used - t.cp.fee;
  t.blendedFee = t.n ? t.fee / t.n : 0;
  t.feeRate = t.paid ? t.fee / t.paid : 0;
  return t;
}

function settingsPanel() {
  var s = state.settings;
  return '<div class="panel"><div class="panel-head"><div class="panel-title">Settings</div></div><div class="settings">' +
    '<div><label>Management fee per campaign ($)</label><input type="number" min="0" step="50" id="set-fee" value="' + esc(s.feePerCampaign) + '"></div>' +
    '<div><label>Maximum management per group ($)</label><input type="number" min="0" step="50" id="set-cap" value="' + esc(s.feeCap) + '"></div>' +
    '<div><label>Campaigns expected per month</label><input type="number" min="0" step="1" id="set-expected" value="' + esc(s.expectedCampaigns) + '" placeholder="Blank = forecast it"></div>' +
    '<div><label>After a Re-forecast, change a set campaign only if its management is off by more than ($)</label><input type="number" min="0" step="10" id="set-tol" value="' + esc(s.tolerance) + '"></div>' +
    '<div><label>Weight for campaigns expected but not here yet (%)</label><input type="number" min="0" max="100" step="5" id="set-hedge" value="' + esc(s.hedge) + '"></div>' +
    '<div><label>Board ID to read live Meta spend from</label><input type="text" id="set-spend" value="' + esc(s.spendBoardId) + '" placeholder="Leave blank to turn off"></div>' +
    '</div><div class="settings-actions"><button class="btn btn-primary" data-settings-save>Save</button><button class="btn" data-settings-reset>Reset to defaults</button><span class="stamp">Saved in this browser only.</span></div></div>';
}

function render() {
  if (state.error) { root.innerHTML = '<div class="error-state"><div class="error-icon">⚠</div><p>' + esc(state.error) + "</p></div>"; return; }
  if (state.loading || !state.board) { root.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading board…</p></div>'; return; }

  var b = state.board;
  var groups = b.groups;
  var counts = {};
  b.items.forEach(function (it) { if (counted(it)) counts[it.groupId] = (counts[it.groupId] || 0) + 1; });

  var h = '<div class="wrap"><div class="header"><div class="header-left">' + LOGO + '<span class="board-name">' + esc(b.name) + "</span></div>" +
    '<div class="header-right">' + (state.loadedAt ? '<span class="stamp">Updated ' + esc(state.loadedAt.toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" })) + "</span>" : "") +
    '<button class="btn" data-refresh>Refresh</button><button class="btn" data-settings-toggle>' + (state.showSettings ? "Close settings" : "Settings") + "</button></div></div>";

  if (state.showSettings) h += settingsPanel();
  if (b.missing && b.missing.length) h += '<div class="warning">This board is missing a column called ' + esc(b.missing.join(" and ")) + ", so the numbers below will be empty. Add it (the name has to match) and hit Refresh.</div>";
  if (state.writeError) h += '<div class="warning">' + esc(state.writeError) + "</div>";
  if (state.spendNote) h += '<div class="warning">' + esc(state.spendNote) + "</div>";

  h += '<div class="cat-tabs"><button class="cat-tab' + (state.tab === "all" ? " active" : "") + '" data-tab="all">Whole board</button>';
  groups.forEach(function (g) {
    h += '<button class="cat-tab' + (state.tab === g.id ? " active" : "") + '" data-tab="' + esc(g.id) + '"><span class="sdot" style="background:' + esc(g.color || "#888") + '"></span>' + esc(g.title) + '<span class="tab-count">' + (counts[g.id] || 0) + "</span></button>";
  });
  h += "</div>";

  if (state.tab === "all") {
    h += cards(boardTotals(groups), groups.length);
    if (groups.length > 1) h += summaryTable(groups);
    groups.forEach(function (g, i) { h += groupPanel(g, { link: true }); });
    if (!groups.length) h += '<div class="empty">This board has no groups yet.</div>';
  } else {
    var g = groups.filter(function (x) { return x.id === state.tab; })[0];
    var real = allocate(b.items.filter(function (it) { return it.groupId === g.id; }), g);
    h += cards(real, 1);
    h += groupPanel(g, { planner: true });
  }
  h += "</div>";
  root.innerHTML = h;
}

/* ---------- events ---------- */

root.addEventListener("click", function (e) {
  var t = e.target.closest("[data-tab],[data-item],[data-apply],[data-reforecast],[data-refresh],[data-settings-toggle],[data-settings-save],[data-settings-reset],[data-plan-clear]");
  if (!t) return;
  if (t.hasAttribute("data-apply")) { applyAll(t.getAttribute("data-apply")); return; }
  if (t.hasAttribute("data-item")) {
    if (monday) monday.execute("openItemCard", { itemId: Number(t.getAttribute("data-item")) });
    return;
  }
  if (t.hasAttribute("data-tab")) { state.tab = t.getAttribute("data-tab"); state.reforecastResult = null; window.scrollTo(0, 0); }
  else if (t.hasAttribute("data-reforecast")) {
    if (state.reforecasting) return;
    state.pendingReforecast = state.reforecasting = t.getAttribute("data-reforecast");
    state.reforecastResult = null;
    render(); loadBoard(); return;
  }
  else if (t.hasAttribute("data-refresh")) { loadBoard(); return; }
  else if (t.hasAttribute("data-settings-toggle")) state.showSettings = !state.showSettings;
  else if (t.hasAttribute("data-plan-clear")) delete state.plan[state.tab];
  else if (t.hasAttribute("data-settings-reset")) {
    state.settings = Object.assign({}, DEFAULTS); saveSettings(state.settings); state.showSettings = false; loadBoard(); return;
  }
  else if (t.hasAttribute("data-settings-save")) {
    var fee = num(document.getElementById("set-fee").value), cap = num(document.getElementById("set-cap").value);
    state.settings = {
      feePerCampaign: fee == null || fee < 0 ? DEFAULTS.feePerCampaign : fee,
      feeCap: cap == null || cap < 0 ? DEFAULTS.feeCap : cap,
      spendBoardId: document.getElementById("set-spend").value.replace(/[^0-9]/g, ""),
      expectedCampaigns: num(document.getElementById("set-expected").value) || "",
      tolerance: (function (v) { return v == null || v < 0 ? DEFAULTS.tolerance : v; })(num(document.getElementById("set-tol").value)),
      hedge: (function (v) { return v == null ? DEFAULTS.hedge : Math.max(0, Math.min(100, v)); })(num(document.getElementById("set-hedge").value))
    };
    saveSettings(state.settings); state.showSettings = false; loadBoard(); return;
  }
  render();
});

root.addEventListener("change", function (e) {
  var key = e.target.getAttribute && e.target.getAttribute("data-plan");
  if (!key || state.tab === "all") return;
  var p = state.plan[state.tab] || { count: 0, paid: "" };
  var v = num(e.target.value);
  if (key === "count") p.count = v == null ? 0 : Math.max(0, Math.min(20, Math.round(v)));
  else p.paid = v == null ? "" : Math.max(0, v);
  state.plan[state.tab] = p;
  // Wait for the blur that fired this to finish, then put the cursor back where the user tabbed to.
  setTimeout(function () {
    var a = document.activeElement, focus = a && a.getAttribute && a.getAttribute("data-plan");
    render();
    var el = focus && root.querySelector('[data-plan="' + focus + '"]');
    if (el) el.focus();
  }, 0);
});

/* ---------- boot ---------- */

if (demo) {
  loadBoard();
} else if (!monday) {
  state.loading = false;
  state.error = "Could not load the monday SDK. Check your connection and refresh.";
  render();
} else {
  var timeout = setTimeout(function () {
    if (state.boardId) return;
    state.loading = false;
    state.error = "Could not connect to monday.com. This page only works as a board view inside monday.";
    render();
  }, 8000);
  monday.listen("context", function (res) {
    var id = res && res.data && (res.data.boardId || (res.data.boardIds && res.data.boardIds[0]));
    if (!id || String(id) === String(state.boardId)) return;
    clearTimeout(timeout);
    state.boardId = String(id); state.board = null; state.tab = "all"; state.plan = {}; state.forecasts = {};
    loadBoard();
  });
  var refreshTimer = null;
  monday.listen("events", function () {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(loadBoard, 1200);
  });
}

})();
</script>
